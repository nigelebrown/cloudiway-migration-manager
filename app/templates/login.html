<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JCF Migration Console</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#12345a,#07111f 52%)}
.card{width:min(92vw,390px);background:#101a2b;border:1px solid #22324a;padding:30px;border-radius:18px;box-shadow:0 20px 70px #0009}h1{font-size:24px;margin:0 0 6px}.muted{color:#95a4b8}.err{background:#451a1a;color:#fecaca;padding:10px;border-radius:8px}.field{margin:18px 0}input{width:100%;box-sizing:border-box;padding:13px;border-radius:9px;border:1px solid #334155;background:#0b1220;color:#fff}button{width:100%;padding:13px;border:0;border-radius:9px;background:#0284c7;color:#fff;font-weight:800;cursor:pointer}
</style></head><body><div class="card"><h1>JCF Mail Migration</h1><div class="muted">Migration Control Console</div>{% if error %}<p class="err">{{error}}</p>{% endif %}<form method="post" action="/login"><div class="field"><input type="password" name="admin_password" placeholder="Administrator password" required></div><button>Sign in</button></form></div></body></html>
