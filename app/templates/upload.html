<!doctype html><html><head><meta charset="utf-8"><title>Upload users</title>
<style>body{font-family:system-ui;background:#0b1220;color:#e5e7eb}.wrap{max-width:760px;margin:40px auto}.card{background:#111827;padding:25px;border-radius:12px}a{color:#38bdf8}button,input{padding:12px;margin:8px;border-radius:7px}.err{color:#fca5a5}</style></head>
<body><div class="wrap"><p><a href="/dashboard">← Dashboard</a></p><div class="card"><h2>Upload migration users</h2>
<p>XLSX or CSV. Required columns: <b>source_email</b>, <b>target_email</b>. Optional: first_name, last_name.</p>
{% if error %}<p class="err">{{error}}</p>{% endif %}
<form method="post" enctype="multipart/form-data"><input type="file" name="file" accept=".xlsx,.csv" required><button>Upload</button></form>
</div></div></body></html>
